name: Keep Supabase Awake (secours)

# ───────────────────────────────────────────────────────────────
#  Le anti-pause Supabase (plan gratuit, pause après 7 jours sans
#  activité) est désormais assuré par un job pg_cron interne à
#  chaque projet Supabase (dev + prod), qui touche une vraie table
#  chaque jour — voir migration "enable_pg_cron_keepalive".
#
#  Pourquoi ce changement (24/08/2026) : ce workflow envoyait un ping
#  HTTP nu (sans apikey) sur /rest/v1/, qui recevait bien une réponse
#  401 "No API key found" — mais cette requête est très probablement
#  rejetée par la passerelle avant d'atteindre Postgres, donc elle ne
#  compte pas forcément comme activité réelle pour Supabase. La base
#  s'est mise en pause malgré des runs "réussis". pg_cron s'exécute
#  DANS la base elle-même : c'est fiable par construction et ne
#  dépend plus du réseau GitHub Actions (source des échecs précédents,
#  probable filtrage anti-bot Cloudflare sur les requêtes authentifiées).
#
#  Ce workflow reste disponible en secours / vérification manuelle
#  uniquement (plus de déclenchement automatique).
# ───────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping des bases Supabase (production + dev)
        run: |
          PROD_URL="https://guhktnlmilhcmgeecdxn.supabase.co/rest/v1/"
          DEV_URL="https://znewlnioznrwqhigfcla.supabase.co/rest/v1/"

          FAIL=0
          for ENTRY in "production:$PROD_URL" "dev:$DEV_URL"; do
            NAME="${ENTRY%%:*}"
            URL="${ENTRY#*:}"
            echo "Réveil de la base Supabase ($NAME)…"

            HTTP_CODE=""
            for TRY in 1 2 3; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" || echo "")
              if [ -n "$HTTP_CODE" ] && [ "$HTTP_CODE" != "000" ]; then break; fi
              echo "  ⏳ Tentative $TRY échouée (réseau), nouvel essai…"
              sleep 5
            done

            echo "  Code HTTP renvoyé : ${HTTP_CODE:-aucun (échec réseau)}"
            if [ -n "$HTTP_CODE" ] && [ "$HTTP_CODE" != "000" ]; then
              echo "  ✅ Base $NAME atteinte."
            else
              echo "  ❌ Aucune réponse de $NAME — vérifier le job pg_cron 'keepalive-daily' dans chaque projet."
              FAIL=1
            fi
          done
          exit $FAIL
